# CI for the kit itself. On GitLab/Azure DevOps, the same three commands
# (install, pytest, build) work in any Python job.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build wheel and check it contains the theme + assets
        run: |
          python -m build
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ["sas_theme/themes/sas-light.toml",
                           "sas_theme/tokens/sas-tokens.css",
                           "sas_theme/assets/sas-brand/sas_logo_blue.svg",
                           "sas_theme/assets/sas-brand/sas_logo_white.svg"]:
              assert required in names, f"missing from wheel: {required}"
          print("wheel contents OK")
          EOF
